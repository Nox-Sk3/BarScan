<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BarScan OCR Specialist</title>
    <!-- QuaggaJS for Barcode Scanning -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 15px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; text-align: center; color: #1a73e8; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
        button.secondary { background: #5f6368; }
        button.success { background: #34a853; }
        button.danger { background: #ea4335; }
        #interactive.viewport { width: 100%; height: 220px; position: relative; overflow: hidden; border-radius: 8px; background: #000; display: none; margin-bottom: 10px; }
        #interactive.viewport video, #interactive.viewport canvas { width: 100%; height: 100%; object-fit: cover; }
        #cameraInput { display: none; }
        .file-label { display: block; background: #e8f0fe; color: #1a73e8; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; border: 2px dashed #1a73e8; cursor: pointer; margin-bottom: 10px; }
        textarea { width: 100%; height: 250px; font-family: monospace; font-size: 1.05rem; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; background: #fafafa; line-height: 1.5; }
        .status { font-size: 0.85rem; color: #666; text-align: center; margin-top: 5px; min-height: 20px; }
        .badge { display: inline-block; background: #e6f4ea; color: #137333; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ถ่ายรูปอ่านเฉพาะตัวเลขบาร์โค้ด</h2>
        
        <label for="cameraInput" class="file-label">
            📷 กดเพื่อถ่ายรูปป้ายบาร์โค้ด
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <div class="btn-group">
            <button id="btnScanCam" class="secondary">เปิดกล้องสแกนสด</button>
            <button id="btnShare" class="success">ส่งออก / แชร์</button>
        </div>

        <div id="interactive" class="viewport"></div>
        <div id="status" class="status">พร้อมใช้งาน (เลือกถ่ายรูปเพื่อความแม่นยำสูง)</div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong>รายการข้อมูล (<span id="count">0</span>)</strong>
            <button id="btnClear" class="danger" style="padding: 4px 10px; font-size: 0.8rem;">ล้างข้อมูล</button>
        </div>
        <textarea id="resultText" placeholder="ข้อมูลที่อ่านได้จะเรียงลงมาทีละบรรทัดที่นี่..."></textarea>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const statusDiv = document.getElementById('status');
        const resultText = document.getElementById('resultText');
        const countSpan = document.getElementById('count');
        const btnScanCam = document.getElementById('btnScanCam');
        const viewport = document.getElementById('interactive');

        let isScanning = false;
        let lastResult = '';
        let lastTime = 0;

        // Pattern: ตัวเลข 7 หลัก + ช่องว่าง(ถ้ามี) + ตัวอักษร 1-2 หลัก + ช่องว่าง + ตัวเลข 5 หลัก + ช่องว่าง + ตัวเลข 5 หลัก
        // รองรับทั้งแบบมี/ไม่มีเว้นวรรค
        const barcodeRegex = /\b(\d{7})\s*([A-Za-z]{1,2})\s*(\d{5})\s*(\d{5})\b/;

        function updateCount() {
            const lines = resultText.value.trim().split('\n').filter(l => l.length > 0);
            countSpan.innerText = lines.length;
        }

        function appendResult(code) {
            const now = Date.now();
            if (code === lastResult && (now - lastTime) < 3000) return; // กันซ้ำภายใน 3 วินาที
            
            lastResult = code;
            lastTime = now;

            if (resultText.value.length > 0 && !resultText.value.endsWith('\n')) {
                resultText.value += '\n';
            }
            resultText.value += code;
            updateCount();

            // เสียงปี๊บและสั่นตอบรับ
            if (navigator.vibrate) navigator.vibrate(100);
            playBeep();
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        // --- ระบบ OCR อ่านเฉพาะชุดตัวเลขบาร์โค้ดจากภาพถ่าย ---
        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = '⌛ กำลังวิเคราะห์ตัวเลขบาร์โค้ด...';

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ',
                });

                const ret = await worker.recognize(file);
                await worker.terminate();

                const text = ret.data.text;
                console.log("Raw OCR Text:", text);

                // ค้นหาเฉพาะชุดตัวเลขที่ตรงตามรูปแบบบาร์โค้ด
                const match = text.match(barcodeRegex);

                if (match) {
                    // จัดฟอร์แมตให้เป็นมาตรฐาน: 0811001 E 77000 77150
                    const formattedCode = `${match[1]} ${match[2].toUpperCase()} ${match[3]} ${match[4]}`;
                    appendResult(formattedCode);
                    statusDiv.innerHTML = `<span class="badge">✓ อ่านสำเร็จ: ${formattedCode}</span>`;
                } else {
                    statusDiv.innerText = '❌ ไม่พบชุดตัวเลขบาร์โค้ด กรุณาถ่ายใหม่อีกครั้ง';
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerText = '❌ เกิดข้อผิดพลาดในการอ่านภาพ';
            }
            cameraInput.value = '';
        });

        // --- ระบบสแกนกล้องสด (QuaggaJS) ---
        btnScanCam.addEventListener('click', () => {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        });

        function startScanner() {
            viewport.style.display = 'block';
            statusDiv.innerText = 'กำลังเปิดกล้องสแกนบาร์โค้ด...';

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: viewport,
                    constraints: { facingMode: "environment" }
                },
                decoder: {
                    readers: ["code_128_reader", "code_39_reader", "ean_reader"]
                }
            }, function(err) {
                if (err) {
                    statusDiv.innerText = '❌ ไม่สามารถเปิดกล้องได้';
                    return;
                }
                Quagga.start();
                isScanning = true;
                btnScanCam.innerText = 'ปิดกล้อง';
                btnScanCam.classList.replace('secondary', 'danger');
                statusDiv.innerText = 'จ่อกล้องไปที่เส้นบาร์โค้ด...';
            });

            Quagga.onDetected(function(result) {
                const code = result.codeResult.code;
                if (code) {
                    appendResult(code);
                    statusDiv.innerText = `✓ สแกนติด: ${code}`;
                }
            });
        }

        function stopScanner() {
            Quagga.stop();
            isScanning = false;
            viewport.style.display = 'none';
            btnScanCam.innerText = 'เปิดกล้องสแกนสด';
            btnScanCam.classList.replace('danger', 'secondary');
            statusDiv.innerText = 'ปิดกล้องเรียบร้อย';
        }

        // --- ระบบแชร์และล้างข้อมูล ---
        document.getElementById('btnShare').addEventListener('click', async () => {
            const text = resultText.value.trim();
            if (!text) {
                alert('ยังไม่มีข้อมูลให้ส่งออก');
                return;
            }

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'รายการบาร์โค้ด',
                        text: text
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(text);
                alert('คัดลอกข้อความทั้งหมดลง Clipboard แล้ว!');
            }
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if (confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่?')) {
                resultText.value = '';
                updateCount();
                statusDiv.innerText = 'ล้างข้อมูลเรียบร้อย';
            }
        });
    </script>
</body>
</html>
