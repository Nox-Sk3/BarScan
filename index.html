<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Text Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 12px; }
        .container { max-width: 500px; margin: 0 auto; }

        .camera-box { position: relative; width: 100%; height: 420px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .scan-guide { z-index: 6; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; height: 280px; border: 2px dashed #00ff66; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.8); pointer-events: none; transition: background 0.2s, border-color 0.2s; }
        .scan-guide::after { content: "วางป้ายให้อยู่ในกรอบเขียว"; position: absolute; top: -28px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: #00ff66; font-size: 0.8rem; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; }
        .scan-guide.active { border-color: #ffcc00; }
        .scan-guide.flash { background: rgba(0, 255, 102, 0.35); border: 3px solid #00ff66; }

        .btn-scan { width: 100%; background: #007aff; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(0,122,255,0.4); }
        .btn-scan:active { background: #0056b3; }
        .btn-scan.running { background: #ff9500; box-shadow: 0 4px 12px rgba(255,149,0,0.4); }
        .btn-scan:disabled { background: #444; color: #888; box-shadow: none; }

        .status { text-align: center; font-size: 0.95rem; margin-bottom: 4px; min-height: 24px; color: #ffcc00; font-weight: 500; }
        .meter { text-align: center; font-size: 0.72rem; color: #777; margin-bottom: 10px; min-height: 16px; }

        .live-box { margin-bottom: 12px; }
        .live-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 1rem; }
        .live-box small { display: block; color: #777; font-size: 0.72rem; margin-top: 4px; }

        .debug { margin-bottom: 12px; display: none; }
        .debug canvas { width: 100%; height: auto; max-height: 90px; object-fit: contain; background: #000; border-radius: 6px; border: 1px solid #333; }
        .debug pre { font-size: 0.72rem; color: #888; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }

        .result-box { background: #1e1e1e; border-radius: 12px; padding: 12px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        textarea { width: 100%; height: 180px; background: #2a2a2a; color: #00ff66; border: 1px solid #444; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 1.05rem; resize: none; line-height: 1.4; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .btn-action { padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-share { background: #34c759; }
        .btn-clear { background: #ff3b30; }
        .btn-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn-row .btn-scan { margin-bottom: 0; padding: 18px 8px; font-size: 1.1rem; }
        .btn-scan.alt { background: #3a3a3c; box-shadow: none; }
        .btn-scan.alt.running { background: #ff9500; }
        .btn-scan.alt:disabled { background: #2a2a2a; color: #666; }
        .freeze { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; z-index: 5; }
        .freeze.on { display: block; }
        .confirm-bar { display: none; background: #1e1e1e; border: 1px solid #ff9500; border-radius: 10px; padding: 10px; margin-bottom: 12px; text-align: center; font-size: 0.9rem; word-break: break-all; }
        .confirm-bar.on { display: block; }
        .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .zone-bar { position: absolute; left: 4%; width: 92%; top: 10%; height: 38%; border: 1px dashed rgba(255,255,255,0.45); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.55); font-size: 0.75rem; }
        .num-box { position: absolute; left: 4%; width: 92%; top: 54%; height: 26%; border: 2px solid #00ff66; border-radius: 6px; background: rgba(0,255,102,0.06); }
        .num-box span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.75rem; color: #00ff66; background: rgba(0,0,0,0.7); padding: 1px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="freeze" class="freeze"></canvas>
        <div class="scan-guide" id="guide">
            <div class="zone-bar">บาร์โค้ด</div>
            <div class="num-box"><span>ตัวเลขให้ยาวเต็มกรอบนี้</span></div>
        </div>
    </div>

    <div class="btn-row">
        <button id="btnShot" class="btn-scan shot" disabled>📸 กดถ่าย</button>
        <button id="btnScan" class="btn-scan alt" disabled>⏳ กำลังโหลด...</button>
    </div>

    <div id="status" class="status">กำลังเปิดกล้อง...</div>
    <div id="meter" class="meter"></div>

    <div id="confirmBar" class="confirm-bar">
        <div id="confirmText"></div>
        <div class="confirm-btns">
            <button id="btnConfirmSave" class="btn-action btn-share">💾 บันทึก</button>
            <button id="btnConfirmRetake" class="btn-action btn-clear">🔄 ถ่ายใหม่</button>
        </div>
    </div>

    <div class="live-box">
        <input id="liveInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
               placeholder="หรือแตะที่นี่ แล้วกด “สแกนข้อความ” (Live Text)">
        <small>ใช้ Live Text ของ iPhone อ่านเข้าช่องนี้ได้ ระบบจะจัดรูปแบบแล้วเพิ่มลงรายการให้อัตโนมัติ</small>
    </div>

    <div id="debug" class="debug">
        <canvas id="captureCanvas"></canvas>
        <pre id="rawText"></pre>
    </div>

    <div class="result-box">
        <div class="result-header">
            <span>รายการที่บันทึก (<span id="count">0</span>)</span>
        </div>
        <textarea id="resultText" placeholder="ข้อมูลตัวเลขจะมาเรียงที่นี่ทีละบรรทัด..."></textarea>

        <div class="action-btns">
            <button id="btnShare" class="btn-action btn-share">📤 ส่งออก / แชร์</button>
            <button id="btnClear" class="btn-action btn-clear">ล้างทั้งหมด</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const guideEl = document.getElementById('guide');
    const btnScan = document.getElementById('btnScan');
    const statusEl = document.getElementById('status');
    const meterEl = document.getElementById('meter');
    const resultText = document.getElementById('resultText');
    const countSpan = document.getElementById('count');
    const debugBox = document.getElementById('debug');
    const debugCanvas = document.getElementById('captureCanvas');
    const rawTextEl = document.getElementById('rawText');
    const liveInput = document.getElementById('liveInput');
    const btnShot = document.getElementById('btnShot');
    const freezeCv = document.getElementById('freeze');
    const confirmBar = document.getElementById('confirmBar');
    const confirmText = document.getElementById('confirmText');

    // ---- ค่าที่ปรับได้ ----
    const TICK_MS = 120;          // ความถี่เช็กความคม
    const MIN_SHARP = 2.0;        // ความคมขั้นต่ำ (ต่ำกว่านี้ถือว่าไม่มีอะไรให้อ่าน)
    const SHARP_RATIO = 0.8;      // ต้องคมอย่างน้อย 80% ของเฟรมที่ดีที่สุดล่าสุด
    const CONFIRM_NEED = 2;       // ต้องอ่านได้ตรงกันกี่ครั้ง
    const HISTORY_SIZE = 6;       // ดูย้อนหลังกี่รอบ
    const HISTORY_TTL = 8000;     // ผลที่เก่ากว่านี้ (ms) ไม่นับ
    const PAUSE_AFTER_SAVE = 1200;
    const RESET_AFTER_IDLE = 3000; // ไม่เจอรหัสนาน 3 วิ = สแกนรหัสเดิมซ้ำได้

    let worker = null;
    let cameraReady = false, ocrReady = false;
    let scanning = false, busy = false;
    let bestSharp = 0, pauseUntil = 0;
    let history = [];
    let lastSaved = null, lastReadTime = 0;
    let audioCtx = null;

    function setStatus(msg, color) {
        statusEl.innerText = msg;
        statusEl.style.color = color || "#ffcc00";
    }

    function refreshButton() {
        if (cameraReady && ocrReady) {
            btnScan.disabled = false;
            btnScan.innerText = "▶️ ต่อเนื่อง";
            btnShot.disabled = false;
            setStatus("พร้อมแล้ว กดถ่าย หรือกดต่อเนื่องแล้วส่องป้ายค้างไว้");
        }
    }

    // ---------- กล้อง ----------
    async function initCamera() {
        if (!window.isSecureContext || !navigator.mediaDevices) {
            setStatus("❌ ต้องเปิดผ่าน https:// หรือ localhost เท่านั้น", "#ff3b30");
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } },
                audio: false
            });
            video.srcObject = stream;
            await video.play();
            try {
                await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: "continuous" }] });
            } catch (e) {}
            cameraReady = true;
            refreshButton();
        } catch (err) {
            setStatus("❌ ไม่สามารถเข้าถึงกล้องได้ กรุณากดอนุญาตสิทธิ์ใช้งานกล้อง", "#ff3b30");
        }
    }

    async function initOCR() {
        try {
            if (typeof Tesseract === 'undefined') throw new Error('โหลด Tesseract ไม่สำเร็จ');
            worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ',
                preserve_interword_spaces: '1',
                user_defined_dpi: '300',
            });
            ocrReady = true;
            refreshButton();
        } catch (err) {
            console.error(err);
            setStatus("❌ โหลดตัวอ่านไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต) ลองรีเฟรชหน้า", "#ff3b30");
        }
    }

    // ---------- แปลงพิกัดกรอบเขียว -> พิกัดในภาพวิดีโอ (object-fit: cover) ----------
    function getGuideSource(src = video) {
        const vw = src.videoWidth || src.width, vh = src.videoHeight || src.height;
        const box = video.getBoundingClientRect();
        const g = guideEl.getBoundingClientRect();
        const scale = Math.max(box.width / vw, box.height / vh);
        const offX = (vw * scale - box.width) / 2;
        const offY = (vh * scale - box.height) / 2;
        let sx = (g.left - box.left + offX) / scale;
        let sy = (g.top - box.top + offY) / scale;
        let sw = g.width / scale;
        let sh = g.height / scale;
        const padX = sw * 0.02, padY = sh * 0.05;
        sx = Math.max(0, sx - padX); sy = Math.max(0, sy - padY);
        sw = Math.min(vw - sx, sw + padX * 2);
        sh = Math.min(vh - sy, sh + padY * 2);
        return { sx, sy, sw, sh };
    }

    // ---------- วัดความคมแบบเบา (ภาพย่อ) ----------
    const sCanvas = document.createElement('canvas');
    const sCtx = sCanvas.getContext('2d', { willReadFrequently: true });

    function measureSharpness(src = video) {
        const { sx, sy, sw, sh } = getGuideSource(src);
        const W = 320, H = Math.max(24, Math.round(W * sh / sw));
        sCanvas.width = W; sCanvas.height = H;
        sCtx.drawImage(src, sx, sy, sw, sh, 0, 0, W, H);
        const d = sCtx.getImageData(0, 0, W, H).data;
        const g = new Uint8Array(W * H);
        for (let i = 0, p = 0; i < g.length; i++, p += 4) {
            g[i] = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8;
        }
        let sum = 0;
        for (let y = 0; y < H - 1; y++) {
            for (let x = 0; x < W - 1; x++) {
                const i = y * W + x;
                sum += Math.abs(g[i + 1] - g[i]) + Math.abs(g[i + W] - g[i]);
            }
        }
        return sum / (W * H);
    }

    // ---------- ภาพความละเอียดสูงของกรอบ ----------
    const wCanvas = document.createElement('canvas');
    const wCtx = wCanvas.getContext('2d', { willReadFrequently: true });

    function buildWork(src = video) {
        const { sx, sy, sw, sh } = getGuideSource(src);
        const up = Math.min(3, Math.max(1, 1600 / sw));
        const w = Math.round(sw * up), h = Math.round(sh * up);
        wCanvas.width = w; wCanvas.height = h;
        wCtx.imageSmoothingEnabled = true;
        wCtx.imageSmoothingQuality = 'high';
        wCtx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
        const d = wCtx.getImageData(0, 0, w, h).data;
        const gray = new Uint8Array(w * h);
        for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
            gray[i] = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8;
        }
        return { gray, w, h };
    }

    // ลบเงา/แสงไม่เท่ากัน: หาสีพื้นหลังเฉพาะที่ (ค่าสูงสุดต่อบล็อก) แล้วหารออก
    function normalize(gray, w, h) {
        const B = 32;
        const bw = Math.ceil(w / B), bh = Math.ceil(h / B);
        const bg = new Float32Array(bw * bh);
        for (let by = 0; by < bh; by++) {
            for (let bx = 0; bx < bw; bx++) {
                let m = 0;
                const y1 = Math.min(h, (by + 1) * B), x1 = Math.min(w, (bx + 1) * B);
                for (let y = by * B; y < y1; y++) {
                    for (let x = bx * B; x < x1; x++) {
                        const v = gray[y * w + x];
                        if (v > m) m = v;
                    }
                }
                bg[by * bw + bx] = m;
            }
        }
        // ตารางพิกัดบล็อกสำหรับ bilinear
        const xi0 = new Int32Array(w), xi1 = new Int32Array(w), xt = new Float32Array(w);
        for (let x = 0; x < w; x++) {
            const f = x / B - 0.5;
            let i0 = Math.floor(f);
            const t = Math.min(1, Math.max(0, f - i0));
            i0 = Math.min(bw - 1, Math.max(0, i0));
            xi0[x] = i0; xi1[x] = Math.min(bw - 1, i0 + 1); xt[x] = t;
        }
        const out = new Uint8Array(w * h);
        for (let y = 0; y < h; y++) {
            const f = y / B - 0.5;
            let j0 = Math.floor(f);
            const ty = Math.min(1, Math.max(0, f - j0));
            j0 = Math.min(bh - 1, Math.max(0, j0));
            const j1 = Math.min(bh - 1, j0 + 1);
            for (let x = 0; x < w; x++) {
                const a = bg[j0 * bw + xi0[x]], b = bg[j0 * bw + xi1[x]];
                const c = bg[j1 * bw + xi0[x]], d = bg[j1 * bw + xi1[x]];
                const top = a + (b - a) * xt[x];
                const bot = c + (d - c) * xt[x];
                const base = top + (bot - top) * ty;
                const r = gray[y * w + x] / (base + 1);
                let v = (r - 0.3) / 0.65;
                v = v < 0 ? 0 : v > 1 ? 1 : v;
                out[y * w + x] = v * 255;
            }
        }
        return out;
    }

    // ---------- หาแท่งบาร์โค้ดจากลักษณะเส้นตั้ง (แนวนอนเปลี่ยนมาก แนวตั้งแทบไม่เปลี่ยน) ----------
    function rowStats(N, w, h) {
        const gx = new Float32Array(h), gy = new Float32Array(h);
        for (let y = 1; y < h - 1; y++) {
            let sx = 0, sy = 0;
            const o = y * w;
            for (let x = 1; x < w - 1; x++) {
                sx += Math.abs(N[o + x + 1] - N[o + x - 1]);
                sy += Math.abs(N[o + w + x] - N[o - w + x]);
            }
            gx[y] = sx; gy[y] = sy;
        }
        return { gx, gy };
    }

    function findBarcodeRows(gx, gy, h) {
        let maxGx = 0;
        for (let y = 0; y < h; y++) if (gx[y] > maxGx) maxGx = gx[y];
        if (maxGx === 0) return null;
        const isBar = new Uint8Array(h);
        for (let y = 0; y < h; y++) {
            isBar[y] = (gx[y] > 0.3 * maxGx && gy[y] < 0.35 * gx[y]) ? 1 : 0;
        }
        // หาช่วงที่ยาวที่สุด ยอมให้มีช่องว่างได้ 3 แถว
        let best = null, start = -1, last = -1;
        for (let y = 0; y <= h; y++) {
            if (y < h && isBar[y]) {
                if (start < 0) start = y;
                last = y;
            } else if (start >= 0 && (y >= h || y - last > 3)) {
                if (!best || (last - start) > (best[1] - best[0])) best = [start, last];
                start = -1;
            }
        }
        if (best && (best[1] - best[0]) >= h * 0.12) return best;
        return null;
    }

    function trimBand(gx, gy, r0, r1) {
        if (r1 - r0 < 12) return null;
        let m = 0;
        for (let y = r0; y < r1; y++) m = Math.max(m, gx[y] + gy[y]);
        if (m === 0) return null;
        const thr = 0.2 * m;
        let a = -1, b = -1;
        for (let y = r0; y < r1; y++) {
            if (gx[y] + gy[y] > thr) { if (a < 0) a = y; b = y; }
        }
        if (a < 0 || b - a < 10) return null;
        const pad = Math.max(8, Math.round((b - a) * 0.2));
        return [Math.max(r0, a - pad), Math.min(r1, b + pad)];
    }

    function makeCanvas(N, w, r0, r1) {
        const pad = 24, H = r1 - r0;
        const raw = document.createElement('canvas');
        raw.width = w + pad * 2; raw.height = H + pad * 2;
        const ctx = raw.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, raw.width, raw.height);
        const img = ctx.createImageData(w, H);
        for (let i = 0, p = 0; i < w * H; i++, p += 4) {
            const v = N[r0 * w + i];
            img.data[p] = img.data[p + 1] = img.data[p + 2] = v;
            img.data[p + 3] = 255;
        }
        ctx.putImageData(img, pad, pad);
        // ตัวหนังสือเล็กเกินไป -> ขยายให้สูงประมาณ 70px
        if (H < 50) {
            const f = Math.min(2.5, 70 / H);
            const big = document.createElement('canvas');
            big.width = Math.round(raw.width * f); big.height = Math.round(raw.height * f);
            const bctx = big.getContext('2d');
            bctx.imageSmoothingQuality = 'high';
            bctx.drawImage(raw, 0, 0, big.width, big.height);
            return big;
        }
        return raw;
    }

    // ---------- สร้างรายการภาพที่จะลองอ่าน ----------
    function buildCandidates(N, w, h) {
        const { gx, gy } = rowStats(N, w, h);
        const cands = [];

        // กรอบตัวเลขบนจอ (ต้องตรงกับ .num-box ใน CSS) แปลงเป็นแถวของภาพที่ตัดมา
        // ภาพที่ตัดมีขอบเพิ่มด้านบนและล่างข้างละ 5% ของความสูงกรอบ จึงมีตัวหาร 1.10
        const NUM_TOP = 0.54, NUM_H = 0.26, M = 0.04;
        const nr0 = Math.max(0, Math.round(h * (0.05 + NUM_TOP - M) / 1.10));
        const nr1 = Math.min(h, Math.round(h * (0.05 + NUM_TOP + NUM_H + M) / 1.10));
        const numBand = trimBand(gx, gy, nr0, nr1);
        if (numBand) cands.push({ label: 'กรอบตัวเลข', psm: '7', cv: makeCanvas(N, w, numBand[0], numBand[1]) });

        const bar = findBarcodeRows(gx, gy, h);

        if (bar) {
            const below = trimBand(gx, gy, Math.min(h, bar[1] + 4), h);
            const above = trimBand(gx, gy, 0, Math.max(0, bar[0] - 4));
            if (below) cands.push({ label: 'ใต้บาร์โค้ด', psm: '7', cv: makeCanvas(N, w, below[0], below[1]) });
            if (above) cands.push({ label: 'เหนือบาร์โค้ด', psm: '7', cv: makeCanvas(N, w, above[0], above[1]) });
        } else {
            // ไม่เจอแท่งบาร์โค้ด -> แบ่งเป็น 3 แถบซ้อนกันแล้วลองอ่านทีละแถบ
            const cuts = [[0, 0.45], [0.27, 0.73], [0.55, 1]];
            for (const [a, b] of cuts) {
                const r0 = Math.round(h * a), r1 = Math.round(h * b);
                cands.push({ label: `แถบ ${Math.round(a * 100)}-${Math.round(b * 100)}%`, psm: '7', cv: makeCanvas(N, w, r0, r1) });
            }
        }
        cands.push({ label: 'ทั้งกรอบ', psm: '11', cv: makeCanvas(N, w, 0, h) });
        return cands;
    }

    // ---------- แกะรูปแบบ 7 หลัก + ตัวอักษร + 5 + 5 แบบยืดหยุ่น ----------
    const toDigit = { O: '0', Q: '0', D: '0', I: '1', L: '1', '|': '1', Z: '2', S: '5', G: '6', B: '8' };
    function asDigit(ch) {
        if (/\d/.test(ch)) return ch;
        return toDigit[ch] || null;
    }

    // 4 ตัวแรกคือ วัน/เดือน (DDMM) ต้องเป็นวันที่ที่เป็นไปได้
    function validDate(head) {
        const day = parseInt(head.slice(0, 2), 10);
        const month = parseInt(head.slice(2, 4), 10);
        return day >= 1 && day <= 31 && month >= 1 && month <= 12;
    }

    function parseBarcode(raw) {
        const s = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
        for (const letterLen of [1, 2]) {
            const len = 7 + letterLen + 10;
            for (let i = 0; i + len <= s.length; i++) {
                const w = s.substr(i, len);
                let head = '', tail = '', ok = true;
                for (let k = 0; k < 7 && ok; k++) { const c = asDigit(w[k]); if (c === null) ok = false; else head += c; }
                const letters = w.substr(7, letterLen);
                if (ok && !/^[A-Z]+$/.test(letters)) ok = false;
                for (let k = 7 + letterLen; k < len && ok; k++) { const c = asDigit(w[k]); if (c === null) ok = false; else tail += c; }
                if (ok && validDate(head)) return `${head}${letters}${tail}`;
            }
        }
        return null;
    }

    // ---------- เพิ่มลงรายการ ----------
    function addCode(code) {
        if (resultText.value.length > 0 && !resultText.value.endsWith('\n')) resultText.value += '\n';
        resultText.value += code;
        resultText.scrollTop = resultText.scrollHeight;
        updateCount();
    }

    function updateCount() {
        const lines = resultText.value.trim().split('\n').filter(l => l.length > 0);
        countSpan.innerText = lines.length;
    }

    function playBeep() {
        try {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    function flashGuide() {
        guideEl.classList.add('flash');
        setTimeout(() => guideEl.classList.remove('flash'), 500);
    }

    // ---------- ประมวลผลหนึ่งเฟรม ----------
    async function processFrame(src = video) {
        const { gray, w, h } = buildWork(src);
        const N = normalize(gray, w, h);
        const cands = buildCandidates(N, w, h);

        let found = null, rawAll = '', shown = null;
        for (const c of cands) {
            await worker.setParameters({ tessedit_pageseg_mode: c.psm });
            const ret = await worker.recognize(c.cv);
            const text = (ret.data.text || '').trim();
            rawAll += `[${c.label} / psm ${c.psm}] ${text.replace(/\n/g, ' ⏎ ')}\n`;
            if (!shown) shown = c.cv;
            found = parseBarcode(text);
            if (found) { shown = c.cv; break; }
        }

        if (shown) {
            debugCanvas.width = shown.width; debugCanvas.height = shown.height;
            debugCanvas.getContext('2d').drawImage(shown, 0, 0);
            debugBox.style.display = 'block';
        }
        rawTextEl.innerText = rawAll;
        return found;
    }

    // วัน/เดือน (4 ตัวแรก) ที่พบบ่อยที่สุดในรายการที่บันทึกไว้ (ต้องมีอย่างน้อย 3 รายการ)
    function modalDate() {
        const lines = resultText.value.split('\n').map(l => l.trim()).filter(l => l.length >= 4);
        if (lines.length < 3) return null;
        const cnt = {};
        lines.forEach(l => { const d = l.slice(0, 4); cnt[d] = (cnt[d] || 0) + 1; });
        let best = null;
        for (const d in cnt) if (best === null || cnt[d] > cnt[best]) best = d;
        return best;
    }

    function hasPending() {
        const now = Date.now();
        return history.some(e => now - e.t < HISTORY_TTL);
    }

    // โหวตทีละตำแหน่งตัวอักษร ใช้เมื่อมีผลอ่านความยาวเท่ากันอย่างน้อย 3 รอบ
    // และทุกตำแหน่งต้องมีเสียงข้างมากอย่างน้อย 2 เสียง
    function consensus(codes) {
        const byLen = {};
        codes.forEach(c => (byLen[c.length] = byLen[c.length] || []).push(c));
        for (const len in byLen) {
            const g = byLen[len];
            if (g.length < 3) continue;
            let out = '', ok = true;
            for (let i = 0; i < +len && ok; i++) {
                const cnt = {};
                g.forEach(c => { cnt[c[i]] = (cnt[c[i]] || 0) + 1; });
                let best = null;
                for (const ch in cnt) if (best === null || cnt[ch] > cnt[best]) best = ch;
                if (cnt[best] < 2) ok = false; else out += best;
            }
            if (ok) return out;
        }
        return null;
    }

    function handleRead(code) {
        const now = Date.now();
        if (!code) return;
        lastReadTime = now;
        history = history.filter(e => now - e.t < HISTORY_TTL);
        history.push({ code, t: now });
        if (history.length > HISTORY_SIZE) history.shift();
        rawTextEl.innerText += `\nผลที่ผ่านมา: ${history.map(e => e.code).join(' | ')}`;

        if (code === lastSaved) {
            setStatus(`✓ บันทึกแล้ว: ${code} (ขยับไปป้ายอื่นได้เลย)`, "#00ff66");
            return;
        }

        const votes = history.filter(e => e.code === code).length;
        let accepted = null;
        if (votes >= CONFIRM_NEED) accepted = code;
        else accepted = consensus(history.map(e => e.code));

        if (accepted && accepted === lastSaved) {
            setStatus(`✓ บันทึกแล้ว: ${accepted} (ขยับไปป้ายอื่นได้เลย)`, "#00ff66");
            return;
        }
        if (accepted) {
            const usualDate = modalDate();
            addCode(accepted);
            lastSaved = accepted;
            history = [];
            pauseUntil = now + PAUSE_AFTER_SAVE;
            if (navigator.vibrate) navigator.vibrate(150);
            playBeep();
            flashGuide();
            if (usualDate && accepted.slice(0, 4) !== usualDate) {
                // บันทึกแล้ว แต่เตือนว่าวันที่ต่างจากส่วนใหญ่ในชุดนี้ (อาจอ่านผิด หรือเป็นป้ายคนละวันจริง)
                setTimeout(playBeep, 220);
                setStatus(`⚠️ บันทึกแล้ว: ${accepted} แต่วันที่ ${accepted.slice(0, 4)} ต่างจากส่วนใหญ่ (${usualDate}) ตรวจอีกที`, "#ff9500");
            } else {
                setStatus(`✓ บันทึกสำเร็จ: ${accepted}`, "#00ff66");
            }
        } else {
            setStatus(`อ่านได้ ${code} (ยืนยัน ${Math.min(votes, CONFIRM_NEED)}/${CONFIRM_NEED}) ถือนิ่งต่ออีกนิด`, "#ffcc00");
        }
    }

    // ---------- ลูปสแกนต่อเนื่อง ----------
    async function tick() {
        if (!scanning) return;
        try {
            const now = Date.now();
            if (lastSaved && now - lastReadTime > RESET_AFTER_IDLE) lastSaved = null;

            if (!busy && video.readyState >= 2 && video.videoWidth && now >= pauseUntil) {
                const s = measureSharpness();
                bestSharp = Math.max(s, bestSharp * 0.97);
                meterEl.innerText = `ความคม ${s.toFixed(1)} / ดีที่สุดล่าสุด ${bestSharp.toFixed(1)} · กล้อง ${video.videoWidth}×${video.videoHeight}`;

                if (s >= MIN_SHARP && s >= bestSharp * SHARP_RATIO) {
                    busy = true;
                    try {
                        const code = await processFrame();
                        if (code) handleRead(code);
                        else if (!hasPending() && !statusEl.innerText.startsWith('✓')) setStatus("กำลังหาตัวเลข... ถือป้ายให้อยู่ในกรอบและนิ่งสักครู่", "#ffcc00");
                    } finally {
                        busy = false;
                    }
                } else if (s < MIN_SHARP) {
                    if (!hasPending()) setStatus("ยังไม่เจอป้าย ส่องป้ายเข้ามาในกรอบ", "#ffcc00");
                } else {
                    if (!hasPending()) setStatus("ภาพเบลอ รอเฟรมที่คม...", "#ff9500");
                }
            }
        } catch (err) {
            console.error(err);
            busy = false;
            setStatus("❌ เกิดข้อผิดพลาด: " + err.message, "#ff3b30");
        }
        if (scanning) setTimeout(tick, TICK_MS);
    }

    btnScan.addEventListener('click', () => {
        if (!scanning) {
            // ปลดล็อกเสียงด้วยการแตะครั้งแรก
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
            } catch (e) {}
            scanning = true;
            history = []; bestSharp = 0; lastSaved = null;
            btnScan.innerText = "⏹ หยุด";
            btnScan.classList.add('running');
            guideEl.classList.add('active');
            setStatus("กำลังสแกน... ส่องป้ายค้างไว้");
            tick();
        } else {
            scanning = false;
            btnScan.innerText = "▶️ ต่อเนื่อง";
            btnScan.classList.remove('running');
            guideEl.classList.remove('active');
            meterEl.innerText = '';
            setStatus("หยุดสแกนแล้ว");
        }
    });

    // ---------- โหมดกดถ่าย: เก็บภาพ ~1.2 วิ เลือกภาพที่คมที่สุด ฟรีสหน้าจอ แล้วอ่านจากภาพนิ่ง ----------
    const BURST_FRAMES = 10, BURST_GAP = 110, KEEP_FRAMES = 3, SNAP_MAX_W = 2560;
    let shotBusy = false, pendingShotCode = null;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function snapshot() {
        const vw = video.videoWidth, vh = video.videoHeight;
        const k = Math.min(1, SNAP_MAX_W / vw);
        const c = document.createElement('canvas');
        c.width = Math.round(vw * k); c.height = Math.round(vh * k);
        c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
        return c;
    }

    function showFreeze(c) {
        freezeCv.width = c.width; freezeCv.height = c.height;
        freezeCv.getContext('2d').drawImage(c, 0, 0);
        freezeCv.classList.add('on');
    }
    function hideFreeze() { freezeCv.classList.remove('on'); }

    function hideConfirm() { confirmBar.classList.remove('on'); pendingShotCode = null; }
    function showConfirm(code, msg) {
        pendingShotCode = code;
        confirmText.textContent = `${msg}\n${code}`;
        confirmText.style.whiteSpace = 'pre-line';
        confirmBar.classList.add('on');
    }

    function saveShot(code) {
        const lines = resultText.value.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length && lines[lines.length - 1] === code) {
            setStatus(`⚠️ ${code} ซ้ำกับรายการล่าสุด ไม่ได้บันทึกซ้ำ`, "#ff9500");
            return false;
        }
        const usualDate = modalDate();
        addCode(code);
        lastSaved = code; lastReadTime = Date.now();
        if (navigator.vibrate) navigator.vibrate(150);
        playBeep();
        flashGuide();
        if (usualDate && code.slice(0, 4) !== usualDate) {
            setTimeout(playBeep, 220);
            setStatus(`⚠️ บันทึกแล้ว: ${code} แต่วันที่ ${code.slice(0, 4)} ต่างจากส่วนใหญ่ (${usualDate}) ตรวจอีกที`, "#ff9500");
        } else {
            setStatus(`✓ บันทึกสำเร็จ: ${code}`, "#00ff66");
        }
        return true;
    }

    // ยืนยันเมื่อมี 2 ภาพอ่านได้ตรงกัน หรือ 3 ภาพโหวตทีละตำแหน่งได้
    function decideShot(reads) {
        const cnt = {};
        reads.forEach(c => { cnt[c] = (cnt[c] || 0) + 1; });
        for (const c in cnt) if (cnt[c] >= 2) return c;
        if (reads.length >= 3) return consensus(reads);
        return null;
    }

    async function captureShot() {
        if (shotBusy || scanning || !cameraReady || !ocrReady) return;
        shotBusy = true;
        btnShot.disabled = true; btnScan.disabled = true;
        hideConfirm(); hideFreeze();
        try {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume();
            } catch (e) {}

            setStatus("📸 ถือนิ่งๆ กำลังเก็บภาพ...", "#ffcc00");
            guideEl.classList.add('active');

            const top = [];
            for (let i = 0; i < BURST_FRAMES; i++) {
                if (video.readyState >= 2 && video.videoWidth) {
                    const sc = measureSharpness();
                    if (top.length < KEEP_FRAMES || sc > top[top.length - 1].sc) {
                        top.push({ c: snapshot(), sc });
                        top.sort((a, b) => b.sc - a.sc);
                        if (top.length > KEEP_FRAMES) top.length = KEEP_FRAMES;
                    }
                }
                await sleep(BURST_GAP);
            }
            guideEl.classList.remove('active');

            if (!top.length || top[0].sc < MIN_SHARP) {
                setStatus("⚠️ ไม่เจอป้ายในกรอบ หรือภาพเบลอ กดถ่ายใหม่ได้เลย", "#ff9500");
                return;
            }

            showFreeze(top[0].c);
            setStatus("🧊 จับภาพแล้ว กำลังอ่าน...", "#ffcc00");

            const reads = [];
            let accepted = null;
            for (const f of top) {
                const code = await processFrame(f.c);
                if (code) {
                    reads.push(code);
                    accepted = decideShot(reads);
                    if (accepted) break;
                }
            }

            if (accepted) {
                saveShot(accepted);
                await sleep(1200);   // ค้างภาพไว้ให้ตรวจด้วยตา
                hideFreeze();
            } else if (reads.length) {
                const why = reads.length === 1 ? 'อ่านได้ภาพเดียว' : 'อ่านได้แต่แต่ละภาพไม่ตรงกัน';
                showConfirm(reads[0], `${why} ยังยืนยันไม่ได้`);
                setStatus("⚠️ เทียบกับภาพที่ค้างบนจอ ถ้าถูกกดบันทึก ถ้าไม่ถูกกดถ่ายใหม่", "#ff9500");
            } else {
                setStatus("⚠️ อ่านไม่ได้ ลองถ่ายใหม่ (ถือให้นิ่งและให้ตัวเลขอยู่ในกรอบ)", "#ff9500");
                await sleep(700);
                hideFreeze();
            }
        } catch (err) {
            console.error(err);
            guideEl.classList.remove('active');
            hideFreeze();
            setStatus("❌ เกิดข้อผิดพลาด: " + err.message, "#ff3b30");
        } finally {
            shotBusy = false;
            btnShot.disabled = false; btnScan.disabled = false;
        }
    }

    btnShot.addEventListener('click', captureShot);
    document.getElementById('btnConfirmSave').addEventListener('click', () => {
        const c = pendingShotCode;
        hideConfirm(); hideFreeze();
        if (c) saveShot(c);
    });
    document.getElementById('btnConfirmRetake').addEventListener('click', () => {
        hideConfirm(); hideFreeze();
        setStatus("พร้อมถ่ายใหม่");
    });

    // ---------- ช่อง Live Text ----------
    let liveTimer = null;
    liveInput.addEventListener('input', () => {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => {
            const text = liveInput.value;
            if (!text.trim()) return;
            const lines = text.split(/\r?\n/);
            const found = [];
            for (const line of lines) {
                const c = parseBarcode(line);
                if (c) found.push(c);
            }
            if (!found.length && lines.length === 1) {
                const c = parseBarcode(text);
                if (c) found.push(c);
            }
            if (found.length) {
                found.forEach(addCode);
                liveInput.value = '';
                if (navigator.vibrate) navigator.vibrate(150);
                playBeep();
                setStatus(`✓ เพิ่มจาก Live Text ${found.length} รายการ: ${found[found.length - 1]}`, "#00ff66");
            } else if (text.replace(/\s/g, '').length >= 15) {
                setStatus("⚠️ ข้อความที่ได้ไม่ตรงรูปแบบ ลองสแกนใหม่", "#ff9500");
            }
        }, 250);
    });

    document.getElementById('btnShare').addEventListener('click', async () => {
        const text = resultText.value.trim();
        if (!text) return alert('ยังไม่มีข้อมูลให้ส่งออก');
        if (navigator.share) {
            try { await navigator.share({ title: 'รายการบาร์โค้ด', text: text }); } catch (err) {}
        } else {
            navigator.clipboard.writeText(text);
            alert('คัดลอกข้อความลง Clipboard แล้ว!');
        }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
        if (confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่?')) {
            resultText.value = '';
            updateCount();
            lastSaved = null;
            setStatus('ล้างข้อมูลเรียบร้อย');
        }
    });

    initCamera();
    initOCR();
</script>

</body>
