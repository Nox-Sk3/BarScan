<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barcode Scanner Pro</title>
    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 15px; color: #333; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; text-align: center; color: #1a73e8; }
        .btn-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
        button { background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        button.success { background: #34a853; }
        button.danger { background: #ea4335; }
        button.warning { background: #fbbc05; color: #333; }
        #cameraInput { display: none; }
        .file-label { display: block; background: #e8f0fe; color: #1a73e8; text-align: center; padding: 16px; border-radius: 8px; font-weight: bold; border: 2px dashed #1a73e8; cursor: pointer; margin-bottom: 10px; font-size: 1.05rem; }
        .manual-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .manual-box input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
        textarea { width: 100%; height: 220px; font-family: monospace; font-size: 1.05rem; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; background: #fafafa; line-height: 1.5; }
        .status { font-size: 0.9rem; color: #d93025; text-align: center; margin-top: 5px; font-weight: bold; min-height: 22px; }
        .badge { display: inline-block; background: #e6f4ea; color: #137333; padding: 3px 8px; border-radius: 12px; font-size: 0.85rem; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ระบบถ่ายรูปดึงเลขบาร์โค้ด</h2>
        
        <!-- ปุ่มเปิดกล้องบังคับโฟกัสใกล้ -->
        <label for="cameraInput" class="file-label">
            📸 แตะเพื่อถ่ายรูปป้าย (โฟกัสใกล้)
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">

        <!-- ช่องพิมพ์สำรองกรณีรูปอ่านไม่ออกจริงๆ -->
        <div class="manual-box">
            <input type="text" id="manualInput" placeholder="พิมพ์เลข เช่น 1111014 E 70011 00000">
            <button id="btnAddManual" class="warning" style="padding: 0 15px;">เพิ่ม</button>
        </div>

        <div class="btn-group">
            <button id="btnShare" class="success">📤 ส่งออก / แชร์ข้อมูลทั้งหมด</button>
        </div>

        <div id="status" class="status">พร้อมใช้งาน: ถ่ายรูปป้ายให้เห็นตัวเลขชัดเจน</div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong>รายการข้อมูล (<span id="count">0</span> บรรทัด)</strong>
            <button id="btnClear" class="danger" style="padding: 4px 10px; font-size: 0.8rem;">ล้างทั้งหมด</button>
        </div>
        <textarea id="resultText" placeholder="ข้อมูลจะเรียงลงมาทีละบรรทัดที่นี่..."></textarea>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const statusDiv = document.getElementById('status');
        const resultText = document.getElementById('resultText');
        const countSpan = document.getElementById('count');
        const manualInput = document.getElementById('manualInput');
        const btnAddManual = document.getElementById('btnAddManual');

        let lastResult = '';
        let lastTime = 0;

        // รูปแบบตัวเลขบนป้าย เช่น 1111014 E 70011 00000
        const barcodeRegex = /\b(\d{7})\s*([A-Za-z]{1,2})\s*(\d{5})\s*(\d{5})\b/;

        function updateCount() {
            const lines = resultText.value.trim().split('\n').filter(l => l.length > 0);
            countSpan.innerText = lines.length;
        }

        function appendResult(code) {
            const now = Date.now();
            if (code === lastResult && (now - lastTime) < 2000) return;
            
            lastResult = code;
            lastTime = now;

            if (resultText.value.length > 0 && !resultText.value.endsWith('\n')) {
                resultText.value += '\n';
            }
            resultText.value += code;
            updateCount();

            if (navigator.vibrate) navigator.vibrate(100);
            playBeep();
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // เพิ่มข้อมูลจากช่องพิมพ์เอง
        btnAddManual.addEventListener('click', () => {
            const val = manualInput.value.trim();
            if (val) {
                appendResult(val);
                manualInput.value = '';
                statusDiv.innerHTML = `<span class="badge">✓ บันทึกด้วยมือสำเร็จ</span>`;
            }
        });

        // ระบบประมวลผลภาพถ่าย (OCR)
        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = '⌛ กำลังแกะรอยตัวเลขจากภาพ...';

            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ',
                });

                const ret = await worker.recognize(file);
                await worker.terminate();

                const text = ret.data.text;
                console.log("OCR Text:", text);

                const match = text.match(barcodeRegex);

                if (match) {
                    const formattedCode = `${match[1]} ${match[2].toUpperCase()} ${match[3]} ${match[4]}`;
                    appendResult(formattedCode);
                    statusDiv.innerHTML = `<span class="badge">✓ อ่านสำเร็จ: ${formattedCode}</span>`;
                } else {
                    statusDiv.innerText = '⚠️ อ่านไม่เจอรูปแบบตัวเลข ลองกดถ่ายใหม่ให้ใกล้และชัดขึ้น หรือพิมพ์ใส่ช่องด้านบนได้เลยครับ';
                }
            } catch (err) {
                console.error(err);
                statusDiv.innerText = '❌ เกิดข้อผิดพลาดในการประมวลผลรูปภาพ';
            }
            cameraInput.value = '';
        });

        // ส่งออกแชร์
        document.getElementById('btnShare').addEventListener('click', async () => {
            const text = resultText.value.trim();
            if (!text) {
                alert('ยังไม่มีข้อมูลให้ส่งออก');
                return;
            }

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'รายการบาร์โค้ด',
                        text: text
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(text);
                alert('คัดลอกข้อความทั้งหมดลงคลิปบอร์ดแล้ว!');
            }
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            if (confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่?')) {
                resultText.value = '';
                updateCount();
                statusDiv.innerText = 'ล้างข้อมูลเรียบร้อย';
            }
        });
    </script>
</body>
</html>
