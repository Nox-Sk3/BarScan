<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Text Scanner 3s</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 12px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .camera-box { position: relative; width: 100%; height: 320px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* กรอบเล็งเป้า */
        .scan-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 120px; border: 2px dashed #00ff66; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .scan-guide::after { content: "วางชุดตัวเลขให้อยู่ในกรอบนี้"; color: #00ff66; font-size: 0.8rem; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; }

        /* ตัวนับถอยหลัง */
        .countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; font-size: 5rem; font-weight: bold; color: #00ff66; z-index: 10; }

        .btn-scan { width: 100%; background: #007aff; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(0,122,255,0.4); active { background: #0056b3; } }
        .btn-scan:disabled { background: #444; color: #888; box-shadow: none; }

        .status { text-align: center; font-size: 0.95rem; margin-bottom: 12px; min-height: 24px; color: #ffcc00; font-weight: 500; }
        
        .result-box { background: #1e1e1e; border-radius: 12px; padding: 12px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        textarea { width: 100%; height: 180px; background: #2a2a2a; color: #00ff66; border: 1px solid #444; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 1.05rem; resize: none; line-height: 1.4; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .btn-action { padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-share { background: #34c759; }
        .btn-clear { background: #ff3b30; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scan-guide"></div>
        <div id="countdown" class="countdown-overlay">3</div>
    </div>

    <button id="btnStartScan" class="btn-scan">📸 กดสแกน (นับถอยหลัง 3 วิ)</button>
    
    <div id="status" class="status">เปิดกล้องแล้ว ส่องตัวเลขให้อยู่ในกรอบแล้วกดปุ่ม</div>

    <div class="result-box">
        <div class="result-header">
            <span>รายการที่บันทึก (<span id="count">0</span>)</span>
        </div>
        <textarea id="resultText" placeholder="ข้อมูลตัวเลขจะมาเรียงที่นี่ทีละบรรทัด..."></textarea>
        
        <div class="action-btns">
            <button id="btnShare" class="btn-action btn-share">📤 ส่งออก / แชร์</button>
            <button id="btnClear" class="btn-action btn-clear">ล้างทั้งหมด</button>
        </div>
    </div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('captureCanvas');
    const btnStartScan = document.getElementById('btnStartScan');
    const countdownEl = document.getElementById('countdown');
    const statusEl = document.getElementById('status');
    const resultText = document.getElementById('resultText');
    const countSpan = document.getElementById('count');

    // แพตเทิร์นจับเฉพาะตัวเลขบาร์โค้ด เช่น 1111014 E 70011 00000 หรือ 0811001 E 77000 77150
    const barcodeRegex = /(\d{7})\s*([A-Za-z]{1,2})\s*(\d{5})\s*(\d{5})/;

    // เปิดกล้อง iPhone อัตโนมัติ
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            video.srcObject = stream;
        } catch (err) {
            statusEl.innerText = "❌ ไม่สามารถเข้าถึงกล้องได้ กรุณากดอนุญาตสิทธิ์ใช้งานกล้อง";
            statusEl.style.color = "#ff3b30";
        }
    }

    function updateCount() {
        const lines = resultText.value.trim().split('\n').filter(l => l.length > 0);
        countSpan.innerText = lines.length;
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
    }

    // เริ่มกระบวนการนับถอยหลัง 3 วินาที
    btnStartScan.addEventListener('click', () => {
        btnStartScan.disabled = true;
        countdownEl.style.display = 'flex';
        let count = 3;
        countdownEl.innerText = count;

        statusEl.innerText = "ถือนิ้วไว้นิ่งๆ ระบบกำลังโฟกัสภาพ...";
        statusEl.style.color = "#ffcc00";

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownEl.innerText = count;
            } else {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                captureAndProcess();
            }
        }, 1000);
    });

    // จับภาพจากกล้องแล้วส่งไปประมวลผล OCR
    async function captureAndProcess() {
        statusEl.innerText = "⌛ กำลังอ่านตัวเลขจากภาพ...";
        
        // วาดภาพจากวิดีโอลง canvas
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        try {
            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ',
            });

            const ret = await worker.recognize(canvas);
            await worker.terminate();

            const text = ret.data.text;
            console.log("OCR Result:", text);

            const match = text.match(barcodeRegex);

            if (match) {
                const formattedCode = `${match[1]} ${match[2].toUpperCase()} ${match[3]} ${match[4]}`;
                
                // บันทึกลง textarea
                if (resultText.value.length > 0 && !resultText.value.endsWith('\n')) {
                    resultText.value += '\n';
                }
                resultText.value += formattedCode;
                updateCount();

                if (navigator.vibrate) navigator.vibrate(150);
                playBeep();

                statusEl.innerText = `✓ บันทึกสำเร็จ: ${formattedCode}`;
                statusEl.style.color = "#00ff66";
            } else {
                statusEl.innerText = "⚠️ อ่านไม่เจอตัวเลข! ลองขยับมุมกล้องให้อยู่ในกรอบแล้วกดใหม่";
                statusEl.style.color = "#ff9500";
            }
        } catch (err) {
            console.error(err);
            statusEl.innerText = "❌ เกิดข้อผิดพลาดในการอ่านภาพ";
            statusEl.style.color = "#ff3b30";
        }

        btnStartScan.disabled = false;
    }

    // ปุ่มแชร์ข้อมูล
    document.getElementById('btnShare').addEventListener('click', async () => {
        const text = resultText.value.trim();
        if (!text) return alert('ยังไม่มีข้อมูลให้ส่งออก');

        if (navigator.share) {
            try {
                await navigator.share({ title: 'รายการบาร์โค้ด', text: text });
            } catch (err) {}
        } else {
            navigator.clipboard.writeText(text);
            alert('คัดลอกข้อความลง Clipboard แล้ว!');
        }
    });

    // ปุ่มล้างข้อมูล
    document.getElementById('btnClear').addEventListener('click', () => {
        if (confirm('ต้องการล้างข้อมูลทั้งหมดหรือไม่?')) {
            resultText.value = '';
            updateCount();
            statusEl.innerText = 'ล้างข้อมูลเรียบร้อย';
            statusEl.style.color = "#ffcc00";
        }
    });

    // เปิดกล้องทันทีที่เข้าเว็บ
    initCamera();
</script>

</body>
</html>
